<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>PULSE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#06070c;overscroll-behavior:none;
    font:600 16px/1.2 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#eaf6ff;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 22px 0;pointer-events:none;
    font-variant-numeric:tabular-nums;letter-spacing:.08em;z-index:3}
  .hud b{font-size:38px;display:block;line-height:.9}
  .hud span{font-size:10px;opacity:.45;letter-spacing:.22em}
  #right{text-align:right}
  #mid{position:fixed;top:calc(env(safe-area-inset-top) + 22px);left:0;right:0;
    text-align:center;font-size:10px;letter-spacing:.24em;opacity:.4;z-index:3;
    pointer-events:none;font-variant-numeric:tabular-nums}

  .screen{position:fixed;inset:0;z-index:5;display:grid;place-content:center;
    justify-items:center;gap:16px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 45%,#0d1524,#06070c 72%)}
  h1{font-size:13vw;letter-spacing:.24em;font-weight:800;
    background:linear-gradient(90deg,#4be3ff,#b06cff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .sub{font-size:11px;opacity:.5;letter-spacing:.2em;margin-top:-10px}
  .btn{margin-top:10px;padding:20px 44px;border:0;border-radius:999px;font:800 14px/1 inherit;
    letter-spacing:.2em;color:#04070c;background:linear-gradient(90deg,#5ff0ff,#a97bff);
    box-shadow:0 0 40px #4be3ff55}
  .btn.dim{background:#182232;color:#9fb6cc;box-shadow:none}
  .btn:active{transform:scale(.97)}
  .chip{padding:12px 22px;border:1px solid #22303f;border-radius:999px;font:700 11px/1 inherit;
    letter-spacing:.18em;color:#9fb6cc;background:#0d1622}

  #resume{display:grid;gap:2px;padding:14px 26px;border:1px solid #1d3b4d;
    border-radius:16px;background:#0a1720}
  #resume .rl{font-size:9px;letter-spacing:.26em;color:#4be3ff;opacity:.8}
  #resume b{font-size:17px;letter-spacing:.1em}

  #daily{border:1px solid #3b2d5c;border-radius:16px;background:#150f22;padding:14px 30px;
    display:grid;gap:3px}
  #daily .dl{font-size:9px;letter-spacing:.26em;color:#b06cff}
  #daily b{font-size:15px;letter-spacing:.08em}
  #daily.done{opacity:.45}

  #tag{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;
    text-align:center;font-size:10px;letter-spacing:.28em;opacity:.3;pointer-events:none;
    padding:0 24px;line-height:1.6}

  #sel{background:#06070c;place-content:start center;overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);
    touch-action:pan-y;justify-items:stretch}
  #selHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  #selHead b{font-size:13px;letter-spacing:.22em;opacity:.6}
  .wblk{margin-bottom:18px}
  .wlab{font-size:9px;letter-spacing:.26em;opacity:.35;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .cell{aspect-ratio:1;border-radius:12px;border:1px solid #1a2531;background:#0b1219;
    display:grid;place-content:center;gap:3px;font:800 13px/1 inherit;color:#5b7286}
  .cell.done{background:#0f2330;border-color:#2a5f7d;color:#8fe4ff}
  .cell.cur{border-color:#4be3ff;color:#4be3ff;box-shadow:0 0 18px #4be3ff44}
  .cell.lock{opacity:.32}
  .cell.boss{border-color:#5c3b2d}
  .stars{font-size:8px;letter-spacing:1px;color:#ffd24a}

  #end{background:rgba(6,7,12,.82);backdrop-filter:blur(6px)}
  #endScore{font-size:66px;font-weight:800;line-height:.9}
  #endGrade{font-size:42px;font-weight:800;color:#8fd8ff}
  #endMsg{font-size:11px;letter-spacing:.24em;opacity:.6}
  #endStars{font-size:30px;letter-spacing:8px;color:#ffd24a}
  #endStars .off{color:#22303f}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  #oneMore{font-size:12px;letter-spacing:.3em;color:#ffb3c1;
    animation:bl 1s ease-in-out infinite}
  @keyframes bl{50%{opacity:.35}}

  #inst{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);
    z-index:8;background:#0d1a26;border:1px solid #1d3b4d;border-radius:18px;
    padding:16px;display:grid;gap:12px;text-align:center}
  #inst p{font-size:10px;letter-spacing:.2em;opacity:.65;line-height:1.6}
  #dbg{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 70px);
    font:500 9px/1.5 ui-monospace,monospace;color:#7dffc4;opacity:.8;
    white-space:pre;pointer-events:none;z-index:9;display:none}
  .hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud hide" id="hud">
  <div><b id="score">0</b><span>SCORE</span></div>
  <div id="right"><b id="best">0</b><span>BEST</span></div>
</div>
<div id="mid" class="hide"></div>

<div id="start" class="screen">
  <h1>PULSE</h1>
  <p class="sub">TAP WHEN THE RINGS TOUCH</p>
  <div id="resume" class="hide">
    <span class="rl">RESUME</span>
    <b id="resumeTxt">STAGE 1</b>
  </div>
  <div id="daily">
    <span class="dl" id="dailyLbl">DAILY</span>
    <b id="dailyTxt">PLAY</b>
  </div>
  <button class="btn" id="go" type="button">PLAY</button>
  <button class="chip" id="toSel" type="button">ALL STAGES</button>
  <button class="chip hide" id="endlessTop" type="button">ENDLESS</button>
</div>

<div id="sel" class="screen hide">
  <div id="selHead">
    <b>STAGES</b>
    <button class="chip" id="selClose" type="button">CLOSE</button>
  </div>
  <div id="selBody"></div>
  <button class="chip hide" id="endlessBtn" type="button" style="margin-top:6px">ENDLESS</button>
</div>

<div id="end" class="screen hide">
  <div id="endGrade">D</div>
  <div id="endScore">0</div>
  <div id="endStars" class="hide"></div>
  <div id="oneMore" class="hide">ONE MORE</div>
  <div id="endMsg"></div>
  <div class="row" id="endBtns"></div>
</div>

<div id="inst" class="hide">
  <p id="instTxt">ADD TO HOME SCREEN — ONE TAP TO PLAY ANY TIME</p>
  <div class="row">
    <button class="btn" id="instGo" type="button" style="padding:16px 34px">ADD</button>
    <button class="chip" id="instNo" type="button">LATER</button>
  </div>
</div>

<div id="tag">ONE THUMB · ONE TAP</div>
<div id="dbg"></div>

<script>
'use strict';

/* ============================================================================
   ██  TUNING  ██
   ============================================================================ */
const TUNE_VERSION = 3;
const TUNE = {
  minWindowMs:    420,
  speedMin:       0.12,
  speedMax:       1.20,
  startSpeedSlow: 0.18,
  startSpeedNorm: 0.22,
  tolBase:        0.090,
  decayPerHit:    0.982,
  tolFloor:       0.040,
  deathBand:      1.30,
  perfectFrac:    0.30,
  tolMulStart:    1.00,
  tolMulMin:      0.70,
  tolMulMax:      2.40,
  clampLo:        0.80,
  clampHi:        1.20,
  runHitsLow:     10,
  runHitsHigh:    22,
  widen:          1.08,
  tighten:        0.96,
  errWindow:      40,
  rtWindow:       20,
  biasRate:       0.15,
  biasClampFrac:  0.40,
  onboardingStages: 3,
  onboardingMul:  1.50,
  mercyTaps:      5,
  mercyMul:       1.50,
  closeBand:      1.40,
  unlockBonusHits: 40,
  unlockBonusRate: 0.68,
  boredMs:        4200,
  goldChance:     0.12,
  goldBandMul:    0.50,
  driftAmp:       0.022,
  driftSpeed:     1.50,
  offsetMax:      0.05,
  restartDelayMs: 260,
  shakeDecay:     0.90,
  flashDecay:     0.92
};

const WORLDS = 6, PER_WORLD = 10, TOTAL = WORLDS * PER_WORLD;
const LEVEL = {
  tolMul:   [1.15, 1.05, 0.95, 0.88, 0.82, 0.75],
  windowMs: [1300, 1150, 1050,  950,  880,  820],
  ramp:     [0.012, 0.014, 0.016, 0.018, 0.020, 0.022]
};
const MODS = ['none', 'drift', 'gold', 'offset', 'fade', 'drift+offset'];
const WNAME = ['OPEN', 'DRIFT', 'GOLD', 'OFFSET', 'FADE', 'STORM'];
const ENDLESS_UNLOCK = 20;
/* ========================================================================== */

const cv = document.getElementById('c'), g = cv.getContext('2d');
const el = id => document.getElementById(id);
const elScore = el('score'), elBest = el('best'), elMid = el('mid');
const elHud = el('hud'), elStart = el('start'), elSel = el('sel'), elEnd = el('end');
const elTag = el('tag'), elDbg = el('dbg'), elEndBtns = el('endBtns');
const DEBUG = new URLSearchParams(location.search).has('debug');
const PROFILE_VERSION = 5;

const track = (n, p) => { try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(_){} };

let W = 0, H = 0, DPR = 1, MIN = 0, TARGET = 0, MAXR = 0, CX = 0, CY = 0;
let state = 'idle', ringR = 0, speed = 0, score = 0, hits = 0;
let best = +(localStorage.getItem('pulse.best') || 0);
let ghost = JSON.parse(localStorage.getItem('pulse.ghost') || '[]');
let shake = 0, flash = 0, flashC = '255,255,255', deadAt = 0, newBest = false;
let parts = [], pops = [], tPrev = 0, hue = 188, audio = null, wl = null;
let runT = 0, runHits = [], mercy = 0, closeDeath = false;
let driftPhase = 0, goldNext = false, offR = 0;

let mode = 'stage';
let stage = 0, quota = 0, perfects = 0, nonPerfect = 0, failsOnStage = 0, hitsLeft = 0;
let cleared = +(localStorage.getItem('p.cleared') || 0);
let starMap = JSON.parse(localStorage.getItem('p.stars') || '{}');
let lastPlayed = +(localStorage.getItem('p.last') || 0);
let installEvt = null, installAsked = +(localStorage.getItem('p.instask') || 0);
let toastT = 0;
elBest.textContent = best;

/* ---------- player model ---------- */
if(+(localStorage.getItem('p.ver') || 0) !== PROFILE_VERSION){
  localStorage.removeItem('p.tol');
  localStorage.removeItem('p.bias');
  localStorage.setItem('p.ver', PROFILE_VERSION);
}
const prof = {
  err: [], rt: [], retryGaps: [],
  tolMul: +(localStorage.getItem('p.tol') || TUNE.tolMulStart),
  bias: +(localStorage.getItem('p.bias') || 0),
  successEma: 0.7,
  totalHits: +(localStorage.getItem('p.hits') || 0),
  unlocked: JSON.parse(localStorage.getItem('p.unl') || '{"bonus":false}')
};
function saveProf(){
  localStorage.setItem('p.tol', prof.tolMul);
  localStorage.setItem('p.bias', prof.bias);
  localStorage.setItem('p.hits', prof.totalHits);
  localStorage.setItem('p.unl', JSON.stringify(prof.unlocked));
}
const median = a => {
  if(!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return s[Math.floor(s.length / 2)];
};
const medErr = () => median(prof.err);
const medRT = () => median(prof.rt) || 480;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const world = () => Math.min(WORLDS - 1, Math.floor(stage / PER_WORLD));
const isBoss = () => mode === 'stage' && stage % PER_WORLD === PER_WORLD - 1;
const hasMod = m => mode === 'endless' || MODS[world()].includes(m);
const isGoldStage = () => mode === 'endless' || MODS[world()] === 'gold'
  || MODS[world()] === 'drift+offset';
const quotaFor = i => (i % PER_WORLD === PER_WORLD - 1) ? 10
  : Math.min(3 + Math.floor((i % PER_WORLD) / 2), 8);

const onboarding = () => (mode === 'stage' && stage < TUNE.onboardingStages)
  ? TUNE.onboardingMul : 1;
const mercyOn = () => mode === 'stage' && world() <= 2;

function effTolMul(){
  if(mode === 'endless') return prof.tolMul;
  const base = LEVEL.tolMul[world()];
  return clamp(prof.tolMul, base * TUNE.clampLo, base * TUNE.clampHi);
}
function bandMul(){ return (goldNext && isGoldStage()) ? TUNE.goldBandMul : 1; }

const tolerance = () => MIN
  * Math.max(TUNE.tolFloor, TUNE.tolBase * Math.pow(TUNE.decayPerHit, hits))
  * effTolMul() * onboarding() * (mercy > 0 ? TUNE.mercyMul : 1) * bandMul();

const aimR = () => TARGET + prof.bias + offR
  + (hasMod('drift') ? Math.sin(driftPhase) * MIN * TUNE.driftAmp : 0);

function learn(err, rt, wasHit){
  prof.err.push(err); if(prof.err.length > TUNE.errWindow) prof.err.shift();
  prof.rt.push(rt); if(prof.rt.length > TUNE.rtWindow) prof.rt.shift();
  prof.successEma += ((wasHit ? 1 : 0) - prof.successEma) * 0.18;
  if(prof.err.length >= 4){
    const cap = tolerance() * TUNE.biasClampFrac;
    const want = clamp(medErr() * 0.5, -cap, cap);
    prof.bias += (want - prof.bias) * TUNE.biasRate;
  }
  if(wasHit){
    prof.totalHits++;
    if(!prof.unlocked.bonus && prof.totalHits >= TUNE.unlockBonusHits
      && prof.successEma > TUNE.unlockBonusRate){
      prof.unlocked.bonus = true; announce('GOLD RINGS');
    }
  }
  if(prof.retryGaps.length >= 4 && median(prof.retryGaps.slice(-4)) > TUNE.boredMs){
    prof.unlocked.bonus = true; prof.retryGaps = [];
  }
  saveProf();
}

/* ---------- canvas ---------- */
function fit(){
  DPR = Math.min(devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  MIN = Math.min(W, H); CX = W / 2; CY = H * 0.46;
  TARGET = MIN * 0.21; MAXR = MIN * 0.47;
  if(state === 'play') ringR = Math.min(ringR, MAXR);
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));

/* ---------- audio ---------- */
function beep(freq, dur, type, vol){
  if(!audio) return;
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol || 0.05, audio.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(gn).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

/* ---------- fullscreen ---------- */
const DE = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsOn = () => !!(DE.requestFullscreen || DE.webkitRequestFullscreen || DE.webkitRequestFullScreen);
const standalone = () => navigator.standalone === true
  || matchMedia('(display-mode:standalone)').matches
  || matchMedia('(display-mode:fullscreen)').matches;

function rawFS(elx){
  const fn = elx.requestFullscreen || elx.webkitRequestFullscreen || elx.webkitRequestFullScreen;
  if(!fn) return Promise.reject(new Error('unsupported'));
  try{ fn.call(elx, { navigationUI: 'hide' }); }
  catch(_){ try{ fn.call(elx); }catch(e){ return Promise.reject(e); } }
  return new Promise((res, rej) => {
    let n = 0;
    const iv = setInterval(() => {
      if(fsEl()){ clearInterval(iv); res(); }
      else if(++n > 12){ clearInterval(iv); rej(new Error('silent-fail')); }
    }, 40);
  });
}
function hideBars(){
  document.body.style.height = 'calc(100% + 1px)';
  window.scrollTo(0, 1);
  setTimeout(() => window.scrollTo(0, 1), 120);
}
const isIOS = () => /iP(hone|od|ad)/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- install ---------- */
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
function maybeAskInstall(){
  if(standalone() || installAsked > 0) return;
  if(!installEvt && !isIOS()) return;
  installAsked = 1; localStorage.setItem('p.instask', 1);
  el('instTxt').textContent = installEvt
    ? 'ADD TO HOME SCREEN — ONE TAP TO PLAY ANY TIME'
    : 'SHARE → ADD TO HOME SCREEN — ONE TAP TO PLAY ANY TIME';
  el('inst').classList.remove('hide');
  track('install_prompt_shown', { stage, ios: isIOS() });
}
el('instGo').addEventListener('click', async e => {
  e.stopPropagation();
  el('inst').classList.add('hide');
  if(installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt = null; track('installed'); }
  else track('install_instructions');
});
el('instNo').addEventListener('click', e => {
  e.stopPropagation(); el('inst').classList.add('hide');
});

/* ---------- fx ---------- */
function burst(n, col){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = MIN * (0.12 + Math.random() * 0.5);
    parts.push({ x: CX + Math.cos(a) * TARGET, y: CY + Math.sin(a) * TARGET,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2 + Math.random() * 3, life: 1, c: col });
  }
}
function announce(t){
  pops.push({ x: CX, y: CY - TARGET - 46, t: 'NEW: ' + t, s: 18, c: '#7dffc4', life: 2 });
  beep(1046, 0.16, 'triangle', 0.07); buzz([10, 50, 10]);
}
function showToast(msg){
  elMid.textContent = msg;
  elMid.classList.remove('hide');
  clearTimeout(toastT);
  toastT = setTimeout(() => {
    if(state === 'idle') elMid.classList.add('hide');
  }, 1400);
}

/* ---------- flow ---------- */
function startStage(i, m){
  mode = m || 'stage';
  if(mode === 'stage') i = Math.min(i, cleared);
  stage = i;
  quota = mode === 'endless' ? Infinity : mode === 'daily' ? 12 : quotaFor(i);
  perfects = 0; nonPerfect = 0; hits = 0; score = 0; hitsLeft = quota;
  parts = []; pops = []; shake = 0; flash = 0; hue = 188;
  runT = 0; runHits = []; closeDeath = false; goldNext = false;
  driftPhase = 0; offR = 0; newBest = false;
  elScore.textContent = '0';
  elEnd.classList.add('hide'); elSel.classList.add('hide'); elStart.classList.add('hide');
  el('inst').classList.add('hide');
  elHud.classList.remove('hide'); elMid.classList.remove('hide');
  elTag.classList.add('hide');
  if(DEBUG) elDbg.style.display = 'block';

  elMid.textContent = mode === 'endless'
    ? 'ENDLESS'
    : mode === 'daily'
      ? 'DAILY · 12 HITS'
      : 'W' + (world() + 1) + ' · STAGE ' + ((stage % PER_WORLD) + 1)
        + (isBoss() ? ' · BOSS' : '') + ' · ' + WNAME[world()];

  speed = MIN * (stage < TUNE.onboardingStages ? TUNE.startSpeedSlow : TUNE.startSpeedNorm);
  ringR = MAXR;
  state = 'play';
  prof.lastResetAt = performance.now();

  track(mode === 'endless' ? 'endless_start'
    : mode === 'daily' ? 'daily_start' : 'stage_start',
    { stage, world: world(), boss: isBoss() });
}

function nextStage(){
  if(mode === 'endless'){ startStage(stage, 'endless'); return; }
  if(mode === 'daily' || stage + 1 >= TOTAL){ showStart(); return; }
  startStage(stage + 1, 'stage');
}

function prevStage(){
  if(stage <= 0){ showSel(); return; }
  failsOnStage = 0;
  startStage(stage - 1, 'stage');
}

function showSel(){
  state = 'select';
  elHud.classList.add('hide'); elMid.classList.add('hide'); elTag.classList.add('hide');
  elEnd.classList.add('hide'); elStart.classList.add('hide'); el('inst').classList.add('hide');
  elSel.classList.remove('hide');
  renderSel();
}

function renderSel(){
  const body = el('selBody');
  body.innerHTML = '';
  const cur = Math.min(cleared, TOTAL - 1);
  for(let w = 0; w < WORLDS; w++){
    const blk = document.createElement('div');
    blk.className = 'wblk';
    const lab = document.createElement('div');
    lab.className = 'wlab';
    lab.textContent = 'WORLD ' + (w + 1) + ' · ' + WNAME[w];
    blk.appendChild(lab);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for(let p = 0; p < PER_WORLD; p++){
      const i = w * PER_WORLD + p;
      const c = document.createElement('button');
      c.type = 'button';
      const boss = p === PER_WORLD - 1;
      c.className = 'cell' + (i < cleared ? ' done' : i === cur ? ' cur' : i > cleared ? ' lock' : '')
        + (boss ? ' boss' : '');
      c.textContent = boss ? 'B' : (p + 1);
      if(i <= cleared){
        c.addEventListener('click', e => { e.stopPropagation(); startStage(i, 'stage'); });
      } else {
        c.disabled = true;
      }
      if(starMap[i]){
        const s = document.createElement('span');
        s.className = 'stars';
        s.textContent = '★'.repeat(starMap[i]);
        c.appendChild(s);
      }
      grid.appendChild(c);
    }
    blk.appendChild(grid);
    body.appendChild(blk);
  }
  el('endlessBtn').classList.toggle('hide', cleared < ENDLESS_UNLOCK);
}

el('toSel').addEventListener('click', e => { e.stopPropagation(); showSel(); });
el('selClose').addEventListener('click', e => { e.stopPropagation(); showStart(); });
el('endlessBtn').addEventListener('click', e => { e.stopPropagation(); startStage(0, 'endless'); });
el('endlessTop').addEventListener('click', e => { e.stopPropagation(); startStage(0, 'endless'); });

/* ---------- start screen ---------- */
function showStart(){
  state = 'idle';
  elSel.classList.add('hide'); elEnd.classList.add('hide'); elHud.classList.add('hide');
  elMid.classList.add('hide'); el('inst').classList.add('hide');
  elStart.classList.remove('hide');
  elTag.classList.remove('hide');

  const res = el('resume');
  if(cleared > 0){
    res.classList.remove('hide');
    const target = Math.min(cleared, TOTAL - 1);
    el('resumeTxt').textContent = 'STAGE ' + (target + 1) + ' · W' + (Math.floor(target / PER_WORLD) + 1);
  } else res.classList.add('hide');

  const d = dailyInfo();
  el('dailyLbl').textContent = 'DAILY · ' + d.label;
  el('dailyTxt').textContent = d.done ? 'PLAYED · ' + d.score : 'PLAY';
  el('daily').classList.toggle('done', d.done);

  el('endlessTop').classList.toggle('hide', cleared < ENDLESS_UNLOCK);
}

/* ---------- daily ---------- */
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
};
function dailyInfo(){
  const k = todayKey();
  const rec = JSON.parse(localStorage.getItem('p.daily') || '{"d":0,"s":0}');
  const d = new Date();
  return {
    key: k, done: rec.d === k, score: rec.d === k ? rec.s : 0,
    label: (d.getMonth() + 1) + '/' + d.getDate()
  };
}
function seeded(seed){
  let s = seed % 2147483647; if(s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}
el('daily').addEventListener('click', e => {
  e.stopPropagation();
  const d = dailyInfo();
  if(d.done){ showToast('ALREADY PLAYED TODAY'); return; }
  const rnd = seeded(d.key);
  startStage(Math.floor(rnd() * TOTAL), 'daily');
  track('daily_played', { key: d.key });
});

/* ---------- run ---------- */
function tap(){
  if(state === 'dead'){
    if(performance.now() - deadAt > TUNE.restartDelayMs){
      mercy = (closeDeath && mercyOn()) ? TUNE.mercyTaps : 0;
      startStage(stage, mode);
    }
    return;
  }
  if(state !== 'play') return;

  const err = ringR - aimR();
  const rt = performance.now() - prof.lastResetAt;
  const tol = tolerance();

  if(Math.abs(err) <= tol){
    const perfect = Math.abs(err) <= tol * TUNE.perfectFrac;
    learn(err, rt, true);
    hit(perfect);
  } else {
    learn(err, rt, false);
    die(err);
  }
}

const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

function hit(perfect){
  hits++;
  hitsLeft = Math.max(0, quota - hits);
  if(mercy > 0) mercy--;
  if(perfect) perfects++; else nonPerfect++;
  runHits.push({ t: runT, r: ringR });

  const gold = goldNext;
  const mult = (1 + Math.min(Math.floor(hits / 5), 4)) * (gold ? 3 : 1);
  score += (perfect ? 20 : 10) * mult;
  elScore.textContent = score;
  if(score > best){ best = score; elBest.textContent = best; }

  burst(gold ? 26 : perfect ? 18 : 10,
    gold ? '#ffd24a' : perfect ? '#ffdc78' : `hsl(${hue} 100% 65%)`);
  pops.push({ x: CX, y: CY - TARGET - 14,
    t: gold ? 'GOLD +' + ((perfect ? 20 : 10) * mult)
      : perfect ? 'PERFECT' : '+' + ((perfect ? 20 : 10) * mult),
    s: perfect ? 26 : 20,
    c: gold ? '#ffd24a' : perfect ? '#ffdc78' : '#ffffff', life: 1 });

  if(hits % 10 === 0){
    burst(30, '#ffdc78');
    pops.push({ x: CX, y: CY + TARGET + 34, t: hits + '!', s: 40, c: '#ffdc78', life: 1 });
    flash = 0.6; flashC = '255,220,120'; buzz([10, 40, 10, 40, 10]);
  }
  shake = perfect ? 14 : 7;
  if(perfect){ flash = 0.5; flashC = '255,220,120'; }

  const semi = SCALE[hits % SCALE.length] + Math.floor(hits / SCALE.length) * 12;
  beep(220 * Math.pow(2, semi / 12), 0.07, 'triangle', 0.055);

  const wm = mode === 'endless' ? LEVEL.windowMs[5] : LEVEL.windowMs[world()];
  const rm = mode === 'endless' ? LEVEL.ramp[5] : LEVEL.ramp[world()];
  const windowMs = Math.max(TUNE.minWindowMs, wm / (1 + hits * rm));
  speed = clamp((MAXR - aimR()) / (windowMs / 1000), MIN * TUNE.speedMin, MIN * TUNE.speedMax);

  if(quota - hits <= 0){ clear(); return; }

  ringR = MAXR; hue = (hue + 27) % 360;
  if(hasMod('offset')) offR = (Math.random() * 2 - 1) * MIN * TUNE.offsetMax;
  goldNext = prof.unlocked.bonus && isGoldStage() && Math.random() < TUNE.goldChance;
}

function die(signedErr){
  closeDeath = Math.abs(signedErr) < tolerance() * TUNE.closeBand;
  state = 'dead'; deadAt = performance.now();
  shake = 26; flash = 1; flashC = '255,70,100';
  newBest = score > 0 && score >= best;

  if(mode === 'stage'){
    if(hits < TUNE.runHitsLow) prof.tolMul = Math.min(TUNE.tolMulMax, prof.tolMul * TUNE.widen);
    else if(hits > TUNE.runHitsHigh) prof.tolMul = Math.max(TUNE.tolMulMin, prof.tolMul * TUNE.tighten);
    failsOnStage++;
  }

  if(mode === 'daily'){
    const d = dailyInfo();
    localStorage.setItem('p.daily', JSON.stringify({ d: d.key, s: Math.max(d.score, score) }));
  }

  if(score > best){
    best = score; localStorage.setItem('pulse.best', best);
    ghost = runHits.slice(0, 60);
    localStorage.setItem('pulse.ghost', JSON.stringify(ghost));
  }
  elBest.textContent = best;

  burst(26, '#ff5c78'); buzz([45]); beep(120, 0.3, 'sawtooth', 0.08);
  saveProf();

  track(mode === 'endless' ? 'endless_end'
    : mode === 'daily' ? 'daily_fail' : 'stage_fail', {
    stage, hits, hits_left: hitsLeft, score, fails: failsOnStage,
    tune_v: TUNE_VERSION, close: closeDeath
  });

  showEnd(false);
}

function clear(){
  state = 'clear';
  const stars = nonPerfect === 0 ? 3 : nonPerfect <= 1 ? 2 : 1;

  if(mode === 'stage'){
    starMap[stage] = Math.max(starMap[stage] || 0, stars);
    localStorage.setItem('p.stars', JSON.stringify(starMap));
    if(stage + 1 > cleared){ cleared = stage + 1; localStorage.setItem('p.cleared', cleared); }
    failsOnStage = 0;
    track('stage_clear', { stage, stars, score, perfects, tune_v: TUNE_VERSION });
  } else if(mode === 'daily'){
    const d = dailyInfo();
    localStorage.setItem('p.daily', JSON.stringify({ d: d.key, s: Math.max(d.score, score) }));
    track('daily_clear', { score, hits });
  } else {
    track('endless_clear', { score });
  }

  flash = 1; flashC = '125,255,196';
  burst(40, '#7dffc4'); beep(1318, 0.25, 'triangle', 0.09); buzz([20, 40, 20]);
  showEnd(true, stars);
  if(cleared === 1) maybeAskInstall();
}

function showEnd(won, stars){
  elEnd.classList.remove('hide');
  elEndBtns.innerHTML = '';
  const es = el('endStars');
  const om = el('oneMore');

  if(won){
    el('endGrade').textContent = stars === 3 ? 'S' : stars === 2 ? 'A' : 'B';
    el('endGrade').style.color = '#7dffc4';
    el('endMsg').textContent = mode === 'endless' ? 'RUN OVER'
      : mode === 'daily' ? 'DAILY CLEARED' : 'STAGE CLEARED';
    es.classList.remove('hide');
    es.innerHTML = [1, 2, 3].map(n => `<span class="${n <= stars ? '' : 'off'}">★</span>`).join('');
    om.classList.add('hide');
    const b = document.createElement('button');
    b.className = 'btn'; b.type = 'button';
    b.textContent = (mode === 'stage' && stage + 1 >= TOTAL) ? 'ALL CLEAR' : 'NEXT';
    b.addEventListener('click', e => { e.stopPropagation(); nextStage(); });
    elEndBtns.appendChild(b);
  } else {
    el('endGrade').textContent = gradeOf(hits);
    el('endGrade').style.color = '#8fd8ff';
    el('endMsg').textContent = mode === 'endless' ? 'ENDLESS'
      : mode === 'daily' ? 'DAILY' : 'STAGE ' + ((stage % PER_WORLD) + 1);
    es.classList.add('hide');
    om.classList.toggle('hide', !(hitsLeft === 1 && mode === 'stage'));
    const b = document.createElement('button');
    b.className = 'btn'; b.type = 'button'; b.textContent = 'RETRY';
    b.addEventListener('click', e => { e.stopPropagation(); startStage(stage, mode); });
    elEndBtns.appendChild(b);
    if(mode === 'stage' && failsOnStage >= 3){
      const p = document.createElement('button');
      p.className = 'chip'; p.type = 'button'; p.textContent = 'PREV STAGE';
      p.addEventListener('click', e => { e.stopPropagation(); prevStage(); });
      elEndBtns.appendChild(p);
    }
  }
  el('endScore').textContent = score;

  const s = document.createElement('button');
  s.className = 'chip'; s.type = 'button'; s.textContent = 'STAGES';
  s.addEventListener('click', e => { e.stopPropagation(); showSel(); });
  elEndBtns.appendChild(s);
}

const gradeOf = h => h >= 40 ? 'S' : h >= 25 ? 'A' : h >= 15 ? 'B' : h >= 8 ? 'C' : 'D';

function ghostRadius(){
  if(!ghost.length) return null;
  let i = 0;
  while(i < ghost.length - 1 && ghost[i].t < runT) i++;
  const prev = { t: i === 0 ? 0 : ghost[i - 1].t, r: MAXR };
  const cur = ghost[i];
  const span = Math.max(cur.t - prev.t, 1);
  const k = clamp((runT - prev.t) / span, 0, 1);
  return prev.r + (cur.r - prev.r) * k;
}

let booted = false;
async function launch(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }

  if(booted){ startStage(Math.min(cleared, TOTAL - 1), 'stage'); return; }
  booted = true;

  const days = lastPlayed ? Math.round((Date.now() - lastPlayed) / 86400000) : -1;
  track('session_start', { returning: days >= 0, days_since: days, cleared });
  localStorage.setItem('p.last', Date.now());

  let ok = standalone();
  if(!ok && fsOn()){
    try{ await rawFS(DE); ok = true; }
    catch(_){
      try{ await rawFS(document.body); ok = true; }
      catch(__){ ok = false; }
    }
  }
  if(ok){ try{ await screen.orientation.lock('portrait'); }catch(_){} }
  else hideBars();

  fit();
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    await audio.resume();
  }catch(_){}
  try{ wl = await navigator.wakeLock.request('screen'); }catch(_){}

  startStage(Math.min(cleared, TOTAL - 1), 'stage');
}

/* ---------- loop ---------- */
function update(dt){
  if(state === 'play'){
    runT += dt * 1000;
    if(hasMod('drift')) driftPhase += dt * TUNE.driftSpeed;
    ringR -= speed * dt;
    if(ringR < aimR() - tolerance() * TUNE.deathBand) die(ringR - aimR());
  }
  shake *= TUNE.shakeDecay; flash *= TUNE.flashDecay;
  for(const p of parts){
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96; p.life -= dt * 1.7;
  }
  parts = parts.filter(p => p.life > 0);
  for(const p of pops){ p.y -= dt * 46; p.life -= dt * 1.5; }
  pops = pops.filter(p => p.life > 0);
}

function draw(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = g.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.78);
  bg.addColorStop(0, '#0c1420'); bg.addColorStop(1, '#06070c');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  if(state !== 'play' && state !== 'dead') return;

  const tol = tolerance(), aim = aimR();
  const fadeA = hasMod('fade')
    ? clamp((ringR - aim) / (MIN * 0.22), 0.10, 1) : 1;

  g.save();
  if(shake > 0.4) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  g.globalAlpha = fadeA;

  g.lineWidth = tol * 2; g.strokeStyle = 'rgba(90,220,255,0.10)';
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke();
  g.lineWidth = Math.max(2, tol * TUNE.perfectFrac);
  g.strokeStyle = goldNext ? 'rgba(255,210,74,0.45)' : 'rgba(255,220,120,0.30)';
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke();
  g.lineWidth = goldNext ? 4 : 2.5;
  g.strokeStyle = goldNext ? '#ffd24a' : 'rgba(150,245,255,0.9)';
  g.setLineDash([3, 7]);
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke(); g.setLineDash([]);
  g.fillStyle = 'rgba(150,245,255,0.5)';
  g.beginPath(); g.arc(CX, CY, 3, 0, 7); g.fill();
  g.globalAlpha = 1;

  if(state === 'play'){
    const gr = ghostRadius();
    if(gr !== null && hits >= 3){
      g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.18)';
      g.beginPath(); g.arc(CX, CY, Math.max(gr, 2), 0, 7); g.stroke();
    }
    const col = `hsl(${hue} 100% 62%)`;
    g.shadowBlur = 26; g.shadowColor = col;
    g.lineWidth = 5; g.strokeStyle = col;
    g.beginPath(); g.arc(CX, CY, Math.max(ringR, 2), 0, 7); g.stroke();
    g.shadowBlur = 0;
  }
  for(const p of parts){
    g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  for(const p of pops){
    g.globalAlpha = Math.max(0, Math.min(1, p.life)); g.fillStyle = p.c;
    g.textAlign = 'center'; g.font = `800 ${p.s}px ui-sans-serif,system-ui,sans-serif`;
    g.fillText(p.t, p.x, p.y);
  }
  g.globalAlpha = 1;
  g.restore();

  if(flash > 0.01){ g.fillStyle = `rgba(${flashC},${flash * 0.5})`; g.fillRect(0, 0, W, H); }

  if(state === 'play' && quota !== Infinity){
    g.textAlign = 'center';
    g.font = '800 13px ui-sans-serif,system-ui,sans-serif';
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillText(Math.max(0, quota - hits) + ' LEFT', CX, CY + TARGET + 54);
  }

  if(DEBUG && state === 'play'){
    elDbg.textContent =
      'stage  ' + stage + ' m=' + mode + '\n' +
      'tolX   ' + effTolMul().toFixed(2) + '\n' +
      'bias   ' + prof.bias.toFixed(1) + '\n' +
      'window ' + ((MAXR - aimR()) / speed * 1000).toFixed(0) + 'ms\n' +
      'band   ' + tol.toFixed(1) + 'px\n' +
      'left   ' + hitsLeft + '\n' +
      'fails  ' + failsOnStage;
  }
}

function frame(t){
  const dt = Math.min((t - tPrev) / 1000 || 0, 0.05);
  tPrev = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
el('go').addEventListener('click', launch);
el('resume').addEventListener('click', launch);
addEventListener('touchend', e => { if(!booted) launch(e); }, { passive: false });

addEventListener('pointerdown', e => {
  if(!booted) return;
  if(e.target.closest('button, #daily, #resume')) return;
  if(state === 'select') return;
  e.preventDefault();
  if(state === 'play' || state === 'dead') tap();
}, { passive: false });

addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(!booted) launch();
    else if(state === 'play' || state === 'dead') tap();
  }
});

addEventListener('contextmenu', e => e.preventDefault());
addEventListener('fullscreenchange', () => setTimeout(fit, 120));
addEventListener('webkitfullscreenchange', () => setTimeout(fit, 120));
addEventListener('fullscreenerror', e => console.warn('fullscreen failed:', e));
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) navigator.wakeLock?.request('screen').then(l => wl = l).catch(() => {});
});

fit();
showStart();
requestAnimationFrame(frame);
</script>
</body>
