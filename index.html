<body>
<canvas id="c"></canvas>
<div class="hud hide" id="hud">
  <div><b id="score">0</b><span>SCORE</span></div>
  <div id="right"><b id="best">0</b><span>BEST</span></div>
</div>
<div id="start">
  <h1>PULSE</h1>
  <p>TAP WHEN THE RINGS TOUCH</p>
  <button id="go" type="button">PLAY</button>
</div>
<div id="tag">ONE THUMB · ONE TAP</div>
<div id="dbg"></div>
<script>
'use strict';

/* ============================================================================
   ██  TUNING  ██  — everything that decides how the game feels lives here.
   Nothing below this block hardcodes a difficulty number.
   ============================================================================ */
const TUNE_VERSION = 2;  // bump whenever TUNE changes, so analytics can compare versions
const TUNE = {

  /* ---- pace: how much time the player gets ---- */
  startWindowMs:  1300,  // time a ring takes to reach the target at hit 0, ms
  minWindowMs:    420,   // absolute floor on the window, ms
  rampPerHit:     0.012, // fraction the window shortens per hit
  speedMin:       0.12,  // px/s floor, as a fraction of screen
  speedMax:       1.20,  // px/s ceiling, as a fraction of screen
  startSpeedSlow: 0.18,  // opening speed, first runs
  startSpeedNorm: 0.22,  // opening speed, established players

  /* ---- tolerance: how forgiving the hit band is ---- */
  tolBase:        0.090, // starting band, as a fraction of screen
  decayPerHit:    0.982, // band shrink per hit. Higher = easier
  tolFloor:       0.040, // absolute band floor
  deathBand:      2.20,  // how far past the target ends the run, in band-widths
  perfectFrac:    0.30,  // fraction of the band that counts as PERFECT

  /* ---- the learning controller ---- */
  tolMulStart:    1.00,
  tolMulMin:      0.70,  // floor for the learned multiplier
  tolMulMax:      2.40,  // ceiling
  runHitsLow:     10,    // runs shorter than this widen the band
  runHitsHigh:    22,    // runs longer than this tighten it
  widen:          1.08,  // widen factor per short run
  tighten:        0.96,  // tighten factor per long run
  emaRate:        0.18,  // how fast the hit-rate estimate tracks reality
  errWindow:      40,    // error samples kept
  rtWindow:       20,    // reaction-time samples kept
  biasRate:       0.15,  // how fast the target chases their instinct
  biasClampFrac:  0.40,  // max bias shift, in band-widths

  /* ---- onboarding ---- */
  onboardingRuns: 2,     // runs that get the boost
  onboardingHits: 15,    // total hits that get the boost
  onboardingMul:  1.50,  // band multiplier during onboarding

  /* ---- mercy after a near-miss ---- */
  mercyTaps:      5,
  mercyMul:       1.50,
  closeBand:      1.40,  // what counts as "SO CLOSE", in band-widths. Keep below deathBand

  /* ---- content gates ---- */
  unlockDriftHits: 15,   // hits needed to unlock DRIFT
  unlockDriftRate: 0.62, // hit-rate needed to unlock DRIFT
  unlockBonusHits: 40,
  unlockBonusRate: 0.68,
  boredMs:         4200, // retry latency that means they're bored
  goldChance:      0.12,
  driftAmp:        0.022, // drift amplitude, fraction of screen
  driftSpeed:      1.50,  // drift phase speed

  /* ---- feel ---- */
  restartDelayMs:  350,
  shakeDecay:      0.90,
  flashDecay:      0.92

};
/* ========================================================================== */

const cv = document.getElementById('c'), g = cv.getContext('2d');
const elScore = document.getElementById('score'), elBest = document.getElementById('best');
const elStart = document.getElementById('start'), elHud = document.getElementById('hud');
const elTag = document.getElementById('tag'), elGo = document.getElementById('go');
const elDbg = document.getElementById('dbg');
const DEBUG = new URLSearchParams(location.search).has('debug');
const PROFILE_VERSION = 4;

let W = 0, H = 0, DPR = 1, MIN = 0, TARGET = 0, MAXR = 0, CX = 0, CY = 0;
let state = 'idle', ringR = 0, speed = 0, score = 0, hits = 0;
let best = +(localStorage.getItem('pulse.best') || 0);
let ghost = JSON.parse(localStorage.getItem('pulse.ghost') || '[]');
let shake = 0, flash = 0, flashC = '255,255,255', deadAt = 0, newBest = false;
let parts = [], pops = [], tPrev = 0, hue = 188, audio = null, wl = null;
let runT = 0, runHits = [], mercy = 0, closeDeath = false;
let driftPhase = 0, goldNext = false;
elBest.textContent = best;

/* ---------- player model ---------- */
if(+(localStorage.getItem('p.ver') || 0) !== PROFILE_VERSION){
  localStorage.removeItem('p.tol');
  localStorage.removeItem('p.bias');
  localStorage.setItem('p.ver', PROFILE_VERSION);
}

const prof = {
  err: [], rt: [], retryGaps: [],
  tolMul: +(localStorage.getItem('p.tol') || TUNE.tolMulStart),
  bias: +(localStorage.getItem('p.bias') || 0),
  successEma: 0.7,
  runs: 0, deaths: 0, totalHits: +(localStorage.getItem('p.hits') || 0),
  unlocked: JSON.parse(localStorage.getItem('p.unl') || '{"drift":false,"bonus":false}'),
  lastResetAt: 0
};

function saveProf(){
  localStorage.setItem('p.tol', prof.tolMul);
  localStorage.setItem('p.bias', prof.bias);
  localStorage.setItem('p.hits', prof.totalHits);
  localStorage.setItem('p.unl', JSON.stringify(prof.unlocked));
}
const median = a => {
  if(!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return s[Math.floor(s.length / 2)];
};
const medErr = () => median(prof.err);
const medRT = () => median(prof.rt) || 480;

/* ---------- difficulty expressions ---------- */
const onboarding = () => (prof.runs < TUNE.onboardingRuns || prof.totalHits < TUNE.onboardingHits)
  ? TUNE.onboardingMul : 1;

const tolerance = () => MIN
  * Math.max(TUNE.tolFloor, TUNE.tolBase * Math.pow(TUNE.decayPerHit, hits))
  * prof.tolMul * onboarding() * (mercy > 0 ? TUNE.mercyMul : 1);

const aimR = () => TARGET + prof.bias
  + (prof.unlocked.drift ? Math.sin(driftPhase) * MIN * TUNE.driftAmp : 0);

function learn(signedErr, rt, wasHit){
  prof.err.push(signedErr); if(prof.err.length > TUNE.errWindow) prof.err.shift();
  prof.rt.push(rt); if(prof.rt.length > TUNE.rtWindow) prof.rt.shift();

  prof.successEma += ((wasHit ? 1 : 0) - prof.successEma) * TUNE.emaRate;

  if(prof.err.length >= 4){
    const cap = tolerance() * TUNE.biasClampFrac;
    const want = Math.max(-cap, Math.min(cap, medErr() * 0.5));
    prof.bias += (want - prof.bias) * TUNE.biasRate;
  }

  if(wasHit){
    prof.totalHits++;
    if(!prof.unlocked.drift && prof.totalHits >= TUNE.unlockDriftHits
      && prof.successEma > TUNE.unlockDriftRate){
      prof.unlocked.drift = true; announce('DRIFT');
    }
    if(!prof.unlocked.bonus && prof.totalHits >= TUNE.unlockBonusHits
      && prof.successEma > TUNE.unlockBonusRate){
      prof.unlocked.bonus = true; announce('GOLD');
    }
  }

  if(prof.retryGaps.length >= 4 && median(prof.retryGaps.slice(-4)) > TUNE.boredMs){
    if(!prof.unlocked.drift){ prof.unlocked.drift = true; announce('DRIFT'); }
    else if(!prof.unlocked.bonus){ prof.unlocked.bonus = true; announce('GOLD'); }
    prof.retryGaps = [];
  }
  saveProf();
}

/* ---------- canvas ---------- */
function fit(){
  DPR = Math.min(devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  MIN = Math.min(W, H); CX = W / 2; CY = H * 0.46;
  TARGET = MIN * 0.21; MAXR = MIN * 0.47;
  if(state === 'play') ringR = Math.min(ringR, MAXR);
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));

/* ---------- audio ---------- */
function beep(freq, dur, type, vol){
  if(!audio) return;
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol || 0.05, audio.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(gn).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

/* ---------- fullscreen ---------- */
const DE = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement
  || document.msFullscreenElement;
const fsOn = () => !!(DE.requestFullscreen || DE.webkitRequestFullscreen
  || DE.webkitRequestFullScreen || DE.mozRequestFullScreen || DE.msRequestFullscreen);
const standalone = () => navigator.standalone === true
  || matchMedia('(display-mode:standalone)').matches
  || matchMedia('(display-mode:fullscreen)').matches;

function rawFS(el){
  const fn = el.requestFullscreen || el.webkitRequestFullscreen
    || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!fn) return Promise.reject(new Error('unsupported'));
  try{ fn.call(el, { navigationUI: 'hide' }); }
  catch(_){ try{ fn.call(el); }catch(e){ return Promise.reject(e); } }
  return new Promise((res, rej) => {
    let n = 0;
    const iv = setInterval(() => {
      if(fsEl()){ clearInterval(iv); res(); }
      else if(++n > 12){ clearInterval(iv); rej(new Error('silent-fail')); }
    }, 40);
  });
}

function hideBars(){
  document.body.style.height = 'calc(100% + 1px)';
  window.scrollTo(0, 1);
  setTimeout(() => window.scrollTo(0, 1), 120);
}

function iosHint(){
  const ios = /iP(hone|od|ad)/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(ios && !standalone()){
    elTag.textContent = 'SHARE → ADD TO HOME SCREEN FOR TRUE FULLSCREEN';
    elTag.style.opacity = '0.55';
  }
}

/* ---------- game ---------- */
function burst(n, col){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = MIN * (0.12 + Math.random() * 0.5);
    parts.push({ x: CX + Math.cos(a) * TARGET, y: CY + Math.sin(a) * TARGET,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2 + Math.random() * 3, life: 1, c: col });
  }
}

function announce(t){
  pops.push({ x: CX, y: CY - TARGET - 46, t: 'NEW: ' + t, s: 18, c: '#7dffc4', life: 2 });
  beep(1046, 0.16, 'triangle', 0.07); buzz([10, 50, 10]);
}

function reset(){
  if(deadAt) prof.retryGaps.push(performance.now() - deadAt);
  if(prof.retryGaps.length > 8) prof.retryGaps.shift();

  ringR = MAXR; score = 0; hits = 0;
  parts = []; pops = []; shake = 0; flash = 0; hue = 188; newBest = false;
  runT = 0; runHits = []; closeDeath = false; goldNext = false; driftPhase = 0;
  if(mercy > 0) mercy = TUNE.mercyTaps;
  prof.runs++; prof.lastResetAt = performance.now();
  state = 'play'; elScore.textContent = '0';
  speed = MIN * (prof.runs < TUNE.onboardingRuns ? TUNE.startSpeedSlow : TUNE.startSpeedNorm);
}

const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

function hit(perfect){
  hits++;
  if(mercy > 0) mercy--;
  runHits.push({ t: runT, r: ringR });

  const gold = goldNext;
  const mult = (1 + Math.min(Math.floor(hits / 5), 4)) * (gold ? 3 : 1);
  score += (perfect ? 20 : 10) * mult;
  elScore.textContent = score;
  if(score > best){ best = score; elBest.textContent = best; }

  burst(gold ? 26 : perfect ? 18 : 10,
    gold ? '#ffd24a' : perfect ? '#ffdc78' : `hsl(${hue} 100% 65%)`);
  pops.push({ x: CX, y: CY - TARGET - 14,
    t: gold ? 'GOLD +' + ((perfect ? 20 : 10) * mult)
      : perfect ? 'PERFECT' : '+' + ((perfect ? 20 : 10) * mult),
    s: perfect ? 26 : 20,
    c: gold ? '#ffd24a' : perfect ? '#ffdc78' : '#ffffff', life: 1 });

  if(hits % 10 === 0){
    burst(30, '#ffdc78');
    pops.push({ x: CX, y: CY + TARGET + 34, t: hits + '!', s: 40, c: '#ffdc78', life: 1 });
    flash = 0.6; flashC = '255,220,120'; buzz([10, 40, 10, 40, 10]);
  }

  shake = perfect ? 14 : 7;
  if(perfect){ flash = 0.5; flashC = '255,220,120'; }

  const semi = SCALE[hits % SCALE.length] + Math.floor(hits / SCALE.length) * 12;
  beep(220 * Math.pow(2, semi / 12), 0.07, 'triangle', 0.055);

  const windowMs = Math.max(TUNE.minWindowMs, TUNE.startWindowMs / (1 + hits * TUNE.rampPerHit));
  speed = Math.min(MIN * TUNE.speedMax, Math.max(MIN * TUNE.speedMin,
    (MAXR - aimR()) / (windowMs / 1000)));

  ringR = MAXR; hue = (hue + 27) % 360;
  goldNext = prof.unlocked.bonus && Math.random() < TUNE.goldChance;
}

function die(signedErr){
  closeDeath = Math.abs(signedErr) < tolerance() * TUNE.closeBand;
  state = 'dead'; deadAt = performance.now();
  shake = 26; flash = 1; flashC = '255,70,100';
  newBest = score > 0 && score >= best;
  prof.deaths++;

  // every run ends in exactly one miss, so judge difficulty by run length, not per-tap rate
  if(hits < TUNE.runHitsLow)
    prof.tolMul = Math.min(TUNE.tolMulMax, prof.tolMul * TUNE.widen);
  else if(hits > TUNE.runHitsHigh)
    prof.tolMul = Math.max(TUNE.tolMulMin, prof.tolMul * TUNE.tighten);

  if(score > best){
    best = score; localStorage.setItem('pulse.best', best);
    ghost = runHits.slice(0, 60);
    localStorage.setItem('pulse.ghost', JSON.stringify(ghost));
  }
  elBest.textContent = best;

  if(closeDeath){
    pops.push({ x: CX, y: CY - TARGET - 20, t: 'SO CLOSE', s: 22, c: '#ffb3c1', life: 1.6 });
    buzz([30, 60, 30]);
  }
  burst(26, '#ff5c78'); buzz([45]); beep(120, 0.3, 'sawtooth', 0.08);
  saveProf();

  if(typeof gtag === 'function') gtag('event', 'run_end', {
    hits, score, run: prof.runs, close: closeDeath, new_best: newBest,
    tol_mul: +prof.tolMul.toFixed(2), tune_v: TUNE_VERSION
  });
}

function tap(){
  if(state === 'dead'){
    if(performance.now() - deadAt > TUNE.restartDelayMs){
      mercy = closeDeath ? TUNE.mercyTaps : 0;
      reset();
    }
    return;
  }
  if(state !== 'play') return;

  const err = ringR - aimR();
  const rt = performance.now() - prof.lastResetAt;
  const tol = tolerance();

  if(Math.abs(err) <= tol){
    const perfect = Math.abs(err) <= tol * TUNE.perfectFrac;
    learn(err, rt, true);
    hit(perfect);
  } else {
    learn(err, rt, false);
    die(err);
  }
}

const gradeOf = h => h >= 40 ? 'S' : h >= 25 ? 'A' : h >= 15 ? 'B' : h >= 8 ? 'C' : 'D';

function ghostRadius(){
  if(!ghost.length) return null;
  let i = 0;
  while(i < ghost.length - 1 && ghost[i].t < runT) i++;
  const prev = { t: i === 0 ? 0 : ghost[i - 1].t, r: MAXR };
  const cur = ghost[i];
  const span = Math.max(cur.t - prev.t, 1);
  const k = Math.min(Math.max((runT - prev.t) / span, 0), 1);
  return prev.r + (cur.r - prev.r) * k;
}

let launched = false;
async function launch(e){
  if(launched) return;
  if(e){ e.preventDefault(); e.stopPropagation(); }
  launched = true;

  elStart.classList.add('hide');
  elTag.classList.add('hide');
  elHud.classList.remove('hide');
  if(DEBUG) elDbg.style.display = 'block';

  let ok = standalone();
  if(!ok && fsOn()){
    try{ await rawFS(DE); ok = true; }
    catch(_){
      try{ await rawFS(document.body); ok = true; }
      catch(__){ ok = false; }
    }
  }
  if(ok){ try{ await screen.orientation.lock('portrait'); }catch(_){} }
  else { hideBars(); iosHint(); }

  fit(); deadAt = 0; reset();

  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    await audio.resume();
  }catch(_){}
  try{ wl = await navigator.wakeLock.request('screen'); }catch(_){}
}

/* ---------- loop ---------- */
function update(dt){
  if(state === 'play'){
    runT += dt * 1000;
    if(prof.unlocked.drift) driftPhase += dt * TUNE.driftSpeed;
    ringR -= speed * dt;
    if(ringR < aimR() - tolerance() * TUNE.deathBand) die(ringR - aimR());
  }
  shake *= TUNE.shakeDecay; flash *= TUNE.flashDecay;
  for(const p of parts){
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96; p.life -= dt * 1.7;
  }
  parts = parts.filter(p => p.life > 0);
  for(const p of pops){ p.y -= dt * 46; p.life -= dt * 1.5; }
  pops = pops.filter(p => p.life > 0);
}

function draw(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = g.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.78);
  bg.addColorStop(0, '#0c1420'); bg.addColorStop(1, '#06070c');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  if(state === 'idle') return;

  const tol = tolerance(), aim = aimR();
  g.save();
  if(shake > 0.4) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  g.lineWidth = tol * 2; g.strokeStyle = 'rgba(90,220,255,0.10)';
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke();
  g.lineWidth = Math.max(2, tol * TUNE.perfectFrac);
  g.strokeStyle = goldNext ? 'rgba(255,210,74,0.45)' : 'rgba(255,220,120,0.30)';
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke();
  g.lineWidth = goldNext ? 4 : 2.5;
  g.strokeStyle = goldNext ? '#ffd24a' : 'rgba(150,245,255,0.9)';
  g.setLineDash([3, 7]);
  g.beginPath(); g.arc(CX, CY, aim, 0, 7); g.stroke(); g.setLineDash([]);
  g.fillStyle = 'rgba(150,245,255,0.5)';
  g.beginPath(); g.arc(CX, CY, 3, 0, 7); g.fill();

  if(state === 'play'){
    const gr = ghostRadius();
    if(gr !== null && hits >= 3){
      g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.18)';
      g.beginPath(); g.arc(CX, CY, Math.max(gr, 2), 0, 7); g.stroke();
    }
    const col = `hsl(${hue} 100% 62%)`;
    g.shadowBlur = 26; g.shadowColor = col;
    g.lineWidth = 5; g.strokeStyle = col;
    g.beginPath(); g.arc(CX, CY, Math.max(ringR, 2), 0, 7); g.stroke();
    g.shadowBlur = 0;
  }
  for(const p of parts){
    g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  for(const p of pops){
    g.globalAlpha = Math.max(0, Math.min(1, p.life)); g.fillStyle = p.c;
    g.textAlign = 'center'; g.font = `800 ${p.s}px ui-sans-serif,system-ui,sans-serif`;
    g.fillText(p.t, p.x, p.y);
  }
  g.globalAlpha = 1;
  g.restore();

  if(flash > 0.01){ g.fillStyle = `rgba(${flashC},${flash * 0.5})`; g.fillRect(0, 0, W, H); }

  if(state === 'dead'){
    g.textAlign = 'center';
    g.fillStyle = '#fff'; g.font = '800 68px ui-sans-serif,system-ui,sans-serif';
    g.fillText(score, CX, H * 0.42);
    g.font = '800 44px ui-sans-serif,system-ui,sans-serif';
    g.fillStyle = newBest ? '#7dffc4' : '#8fd8ff';
    g.fillText(gradeOf(hits), CX, H * 0.31);
    g.font = '700 12px ui-sans-serif,system-ui,sans-serif';
    g.fillStyle = newBest ? '#7dffc4' : 'rgba(255,255,255,.5)';
    g.fillText(newBest ? 'NEW BEST' : 'BEST ' + best, CX, H * 0.48);
    g.fillStyle = `rgba(255,255,255,${0.55 + 0.45 * Math.sin(performance.now() / 220)})`;
    g.font = '800 14px ui-sans-serif,system-ui,sans-serif';
    g.fillText('TAP TO RETRY', CX, H * 0.58);
  }

  if(DEBUG && state === 'play'){
    elDbg.textContent =
      'bias   ' + prof.bias.toFixed(1) + 'px\n' +
      'tolX   ' + prof.tolMul.toFixed(2) + '\n' +
      'sRate  ' + prof.successEma.toFixed(2) + '\n' +
      'medErr ' + medErr().toFixed(1) + 'px\n' +
      'medRT  ' + medRT().toFixed(0) + 'ms\n' +
      'window ' + ((MAXR - aimR()) / speed * 1000).toFixed(0) + 'ms\n' +
      'pace   ' + speed.toFixed(0) + 'px/s\n' +
      'band   ' + tol.toFixed(1) + 'px\n' +
      'hits   ' + prof.totalHits + '\n' +
      'retry  ' + (median(prof.retryGaps) || 0).toFixed(0) + 'ms\n' +
      'unl    ' + (Object.keys(prof.unlocked).filter(k => prof.unlocked[k]).join(',') || '-');
  }
}

function frame(t){
  const dt = Math.min((t - tPrev) / 1000 || 0, 0.05);
  tPrev = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
elGo.addEventListener('click', launch);
addEventListener('touchend', launch, { passive: false });
addEventListener('pointerdown', e => {
  if(!launched) return;
  e.preventDefault();
  tap();
}, { passive: false });
addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    launched ? tap() : launch();
  }
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('fullscreenchange', () => setTimeout(fit, 120));
addEventListener('webkitfullscreenchange', () => setTimeout(fit, 120));
addEventListener('fullscreenerror', e => console.warn('fullscreen failed:', e));
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) navigator.wakeLock?.request('screen').then(l => wl = l).catch(() => {});
});

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
